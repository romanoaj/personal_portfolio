<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Ava Romano's interactive bookshelf portfolio: experience, projects, research, skills, and more."
    >
    <meta property="og:type" content="website">
    <meta property="og:title" content="Ava Romano | Portfolio">
    <meta
      property="og:description"
      content="Explore Ava Romano's experience, projects, research, skills, and more through an interactive pixel-art bookshelf."
    >
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#24140f">
    <title>Ava Romano | Portfolio</title>
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="src/styles/main.css">
    <script src="src/scripts/content.js" defer></script>
    <script src="src/scripts/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to the portfolio</a>

    <div class="ambient-dust" aria-hidden="true"></div>

    <main id="main-content" class="portfolio-shell" tabindex="-1">
      <section class="bookshelf-cabinet" aria-labelledby="portfolio-title">
        <header class="cabinet-header">
          <div class="nameplate">
            <h1 id="portfolio-title">Ava Romano</h1>
            <p id="shelf-instructions" class="nameplate-instruction">
              Pick a book to open a chapter of the portfolio.
            </p>
          </div>

          <button
            id="catalog-toggle"
            class="catalog-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="catalog-menu"
          >
            <span class="catalog-toggle__label">Browse the catalog</span>
            <span class="catalog-toggle__icon" aria-hidden="true"></span>
          </button>

          <nav id="catalog-menu" class="catalog-menu" aria-label="Portfolio catalog" hidden>
            <a href="#about" data-section="about">About Me</a>
            <a href="#experience" data-section="experience">Experience</a>
            <a href="#projects" data-section="projects">Projects</a>
            <a href="#research" data-section="research">Research</a>
            <a href="#skills" data-section="skills">Skills</a>
            <a href="#education" data-section="education">Education</a>
            <a href="#resume" data-section="resume">Resume</a>
            <a href="#hobbies" data-section="hobbies">Hobbies</a>
            <a href="#contact" data-section="contact">Contact</a>
          </nav>
        </header>

        <section
          id="bookshelf"
          class="shelf-stage"
          aria-label="Interactive portfolio bookshelf"
          aria-describedby="shelf-instructions"
        ></section>

        <noscript>
          <p class="noscript-note">
            This interactive bookshelf needs JavaScript enabled to open its books.
          </p>
        </noscript>
      </section>
    </main>

    <dialog
      id="book-dialog"
      class="book-dialog"
      aria-labelledby="dialog-title"
    >
      <div class="book-dialog-frame">
        <button id="dialog-close" class="dialog-close" type="button" aria-label="Close book">
          <span aria-hidden="true">&times;</span>
        </button>

        <header class="dialog-heading">
          <h2 id="dialog-title"></h2>
        </header>

        <div class="book-spread">
          <section id="page-left" class="book-page book-page-left" aria-label="Left page" tabindex="0"></section>
          <section id="page-right" class="book-page book-page-right" aria-label="Right page" tabindex="0"></section>
        </div>
      </div>
    </dialog>
  </body>
</html>
